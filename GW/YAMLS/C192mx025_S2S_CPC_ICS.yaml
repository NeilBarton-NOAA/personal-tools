experiment:
  net: sfs
  mode: forecast-only
  idate: {{ 'DTG_GW' | getenv }}
  edate: {{ 'DTG_GW' | getenv }}
  pslot: {{ 'pslot' | getenv }}
  app: S2S
  resdetatmos: 192
  resensatmos: 192
  resdetocean: 0.25
  start: 'cold'
  nens: 1
  comroot: {{ 'RUNTESTS' | getenv }}/COMROOT
  expdir: {{ 'RUNTESTS' | getenv }}/EXPDIR
  icsdir: {{ 'TOPICDIR' | getenv }}/CPC_land/C192mx025
  yaml: {{ HOME }}/GW/YAMLS/sfs_full_C192mx025_CPC_ICS.yaml

workflow:
  engine: rocoto
  rocoto:
    maxtries: 2
    cyclethrottle: 3
    taskthrottle: 50
    verbosity: 2
